# The coordinator arm's harness agent config. Its pair is agent-claude-code-oauth.yaml, the
# single-agent control that has already run; the two are meant to be read side by side.
#
# ARM FAIRNESS. Three settings differed between the arms while this was being built, and each
# one on its own would confound the pair. All three are stated here, because this file is the
# only place the coordinator arm gets configured.
#
#   1. Permission mode. The control runs permission_mode: bypassPermissions. Coordinator nodes
#      could only run the hard-coded dontAsk until [kernel] permission_mode became selectable,
#      so the axis could not be matched at all; kernel.permission_mode below matches it. Note
#      the mode does not reach agentdag's own deny hooks either way - the CLI consults a
#      PreToolUse hook before it evaluates permission rules - so write confinement, the Bash
#      denylist and read confinement refuse exactly the same calls under either value.
#   2. CLI version. cli_version below is the version the control arm ACTUALLY RAN, read from
#      claude_code_version on the system/init record of every counted checkpoint's own
#      agent/stdout.jsonl - not from its config, and not from an image tag. It is pinned here
#      because claude-agent-sdk spawns the binary it BUNDLES before anything on PATH, so
#      installing a version in the image does not by itself decide what a node runs; docker.j2
#      deletes the bundled binary and asserts the PATH one at build time. Prove the match after
#      the fact the same way, from this arm's own node transcripts.
#   3. kernel.deny_tools. The shipped default closes WebFetch, WebSearch and Task. The
#      pre-registered decision is that coordinator nodes get the full CLI tool set, so the
#      empty list below is stated explicitly - an explicit empty list is honoured, while a
#      blank value is refused by name.
#   4. kernel.deny_bash. The shipped default also closes `curl -X POST`, `curl --data` and
#      `wget --post`. The calibration control ran exactly those four times on
#      dynamic_config_service_api to exercise the HTTP API it was building, so a coordinator
#      node that cannot would lose a checkpoint for a reason unrelated to decomposition. The
#      pre-registration's decision 3 therefore cuts the list to the three git/gh entries, and
#      that list is stated below rather than left to a default that closes more.
#   5. Effort. `thinking: high` reaches the control as MAX_THINKING_TOKENS=31999; it cannot
#      reach a coordinator node, whose dispatch env is true-allowlisted down to the
#      credential. agentdag resolves effort per node from its tier policy, so the axis is
#      matched in `policy` below, not here - and the two levers are not proven equivalent.
#
# version is written by scripts/scb_install_agentdag.py from its --agentdag-version argument.
# It cannot be committed here: it names the coordinator commit the arm runs, which is chosen
# when the arm is launched.
type: agentdag
version: "REPLACED-BY-INSTALLER"
cli_version: "2.1.260"
sdk_version: "0.2.152"

# cost_limits mirrors the control's, verbatim. cost_limit and net_cost_limit at 0 disable
# those ceilings on both arms; step_limit is what the control passes as --max-turns, and its
# coordinator counterpart is kernel.max_turns below.
cost_limits:
  cost_limit: 0
  step_limit: 100
  net_cost_limit: 0

# agentdag configuration. Each pair is rendered as one --set SECTION.KEY=VALUE on the
# coordinator's command line; a list is passed as JSON, which is how an explicit empty list
# reaches agentdag at all.
settings:
  # (1) matched to the control.
  kernel.permission_mode: bypassPermissions
  # (3) the pre-registered full tool set: close nothing.
  kernel.deny_tools: []
  # (4) the pre-registered denylist: publishing actions only, nothing that would stop a node
  # exercising a local HTTP service it is building.
  kernel.deny_bash: ["git push", "gh pr", "gh release"]
  # The control's step_limit as agentdag's per-node turn ceiling.
  kernel.max_turns: 100
  # Pre-registered decision 4, stated rather than inherited: this is also the shipped default,
  # and an arm that reads its concurrency off a default cannot say what it ran when the default
  # moves. plan-goal works in one shared directory, so concurrent work nodes can collide there.
  kernel.parallel: 8
  # The mechanical gate every gate node runs, in /workspace. pytest's exit 5 on no tests is a
  # real failure here ("you wrote no tests"), which is the point of gating on something the
  # agent cannot satisfy by asserting it did the work. The planner is told this argv, so the
  # nodes know which virtual environment the checkpoint has to end up with.
  kernel.gate_command: [".venv/bin/python", "-m", "pytest", "-q"]

# timeout: the wall-clock ceiling for ONE checkpoint's coordinator run, in seconds. Left
# unset here because the value is a launch decision, not a property of the arm; setting it
# arms the process-group kill the agent holds the ceiling with. A run stopped that way never
# prints its terminal line, so the agent takes its id from the single run directory the
# launch added to the run store. The kill only sends TERM and is not awaited past that, so a
# node still in flight at that moment has not necessarily reported yet: when exactly one run
# directory appeared, what agentdag had already recorded to it by the time records are read
# back is counted; when it could not be read, or zero or several directories appeared, the
# timeout's own AgentError names that instead. The checkpoint fails either way.
# timeout: 0

# policy: a tier policy YAML on the HOST, mounted read-only into the container and passed to
# the coordinator as --policy. Unset means the run takes agentdag's own shipped tier table -
# which for this arm would be WRONG in two pre-registered ways at once: it puts every `work`
# node on sonnet, where the held-fixed table reads "opus-5 for the control and for EVERY
# coordinator node; no cheaper tier anywhere", and it caps the opus row at 8,000,000 tokens
# where decision 1 pre-registers 1,200,000 per checkpoint run. It is also the only lever this
# arm has on effort (note 5 above).
#
# The arm's own table is committed beside this file as arm-tier-policy.yaml, and every line it
# changes is quoted from the pre-registration in its own header. Only the PATH is a launch
# fact, so scripts/scb_install_agentdag.py --policy writes it over the line below, exactly as
# --agentdag-version fills the version in. Leave the line commented to run the shipped table.
# policy: /abs/path/to/tier-policy.yaml
