# ==============================================================================
# Kernel Configuration - the Claude executor's credential and per-run defaults
# ==============================================================================
#
# Settings are loaded via lib_layered_config and can be overridden via:
#   - Host/User config files (see precedence list in defaultconfig.toml)
#   - Environment variables (see below)
#
# Environment Variable Naming
# ---------------------------
# Use lib_layered_config format for all environment variable overrides:
#
#   Format: <SLUG>___<SECTION>__<KEY>=<VALUE>
#
#   Examples:
#     AGENTDAG___CREDENTIALS__CLAUDE_OAUTH_TOKEN_FILE=/home/op/.config/agentdag/claude-oauth-token
#     AGENTDAG___KERNEL__PARALLEL=4
#
# .env File Support
# -----------------
# In .env files (no prefix needed), use double underscore for nesting:
#
#   CREDENTIALS__CLAUDE_OAUTH_TOKEN_FILE=/home/op/.config/agentdag/claude-oauth-token
#   KERNEL__PARALLEL=4
#
# Precedence (lowest to highest):
#   defaults -> app config -> host config -> user config -> .env file -> env vars
#
# IMPORTANT: Never commit a real keyfile path, let alone the token itself, to
# version control - see the srv Iron rule "No secrets in tracked files".
#
[credentials]

# Purpose: path to the operator's Claude Code OAuth-token keyfile (the output of
#   `claude setup-token`, saved to this path). When it names an existing file, each
#   node authenticates with that token and receives nothing else (D3, RESEARCH
#   workflow/design/probes/d3-subscription-terms.md: arm A2 proved
#   CLAUDE_CODE_OAUTH_TOKEN authenticates an SDK child whose CLAUDE_CONFIG_DIR is an
#   EMPTY directory).
# Type: string (absolute path) or ""
# Default: "" - so the SHIPPED default is the credential COPY: a private, owner-only
#   copy of ~/.claude/.credentials.json into each node's own config dir (D3 arm C, the
#   CredentialCopy class). Every node home under a run directory then holds the
#   operator's live credential, and a run directory is never publishable raw. Name a
#   keyfile here to change that.
# Environment Variable: AGENTDAG___CREDENTIALS__CLAUDE_OAUTH_TOKEN_FILE=/path/to/keyfile
# .env: CREDENTIALS__CLAUDE_OAUTH_TOKEN_FILE=/path/to/keyfile
# Note: the file itself is never read by this config layer - only its PATH is
#   configuration; the token is read fresh from disk on every node dispatch.
claude_oauth_token_file = ""

# ==============================================================================
# Kernel run defaults - the coordinator's own limits, shared by every workflow
# ==============================================================================
[kernel]

# Purpose: where a run's own directory (journal, node dirs, artefacts) is created
# Type: string (absolute path)
# Default: "/var/lib/agentdag/runs"
# Environment Variable: AGENTDAG___KERNEL__RUNS_DIR=/var/lib/agentdag/runs
# .env: KERNEL__RUNS_DIR=/var/lib/agentdag/runs
runs_dir = "/var/lib/agentdag/runs"

# Purpose: where a run's own events (suspended, done, failed, crashed) are sent
# Type: string, one of "none" or "mail"
# Default: "none" (no notification; an operator who configured nothing is not
#   signed up for mail)
# Environment Variable: AGENTDAG___KERNEL__NOTIFY=mail
# .env: KERNEL__NOTIFY=mail
# Note: "mail" sends through the same btx_lib_mail adapter `agentdag email
#   send-notification` uses, so it needs the [email] section configured -
#   smtp_hosts, from_address and recipients at minimum. An explicit "mail" with
#   no SMTP host configured FAILS the run command rather than falling back to
#   silence: being told is what the operator asked for. The events are emitted by
#   the coordinator (suspended, done, failed) and by `run apply-deadlines`
#   (crashed) - never by a node, which has no handle on the port.
# Note: `agentdag notify-test` sends one event through whatever this names and
#   REPORTS a failure instead of containing it, which is the only place a broken
#   sink is loud - during a run it is swallowed, so that a mail server being down
#   cannot fail a run that otherwise succeeded.
notify = "none"

# Purpose: how many map branches (or top-level nodes) a run may dispatch at once
# Type: integer
# Default: 8
# Environment Variable: AGENTDAG___KERNEL__PARALLEL=8
# .env: KERNEL__PARALLEL=8
# At 2 this was the binding constraint on every fan-out a planner produced: measured
# 2026-09-02, a four-wide independent fan-out ran two at a time, and 2026-09-03 a
# seven-wide one did the same. The planner decides how wide the work divides; the
# scheduler should not silently quarter it. Concurrency is bounded by the per-node
# token budget and the run-wide row ceilings, which is where a bound belongs.
# NOTE this does not make a GATE node concurrent: Coordinator.gate runs its subprocess
# synchronously on the event loop, so a gate still blocks every in-flight node for its
# whole duration (OPEN-WORK 65). Raising this does not fix that and was not meant to.
parallel = 8

# Purpose: the per-node token budget applied when a node's own spec declares none
# Type: integer
# Default: 300000
# Environment Variable: AGENTDAG___KERNEL__DEFAULT_NODE_TOKENS=300000
# .env: KERNEL__DEFAULT_NODE_TOKENS=300000
# In the unit `charged_tokens` carries since 2026-09-03: input + cache_creation +
# output, with CACHE READS excluded. NOT the old unit, which counted cache reads and
# was therefore worth roughly a seventeenth of the same numeral.
# This is the intended bound on one node's work. Every PLANNER-emitted entry arrives with
# an empty `budget` (the plan schema does not require one and no shipped rule adds one),
# so before this existed the whole model-driven path was uncapped per node and only the
# run-wide row ceiling bound it at all.
default_node_tokens = 300000

# Purpose: the SDK turn ceiling for one node's dispatch (ClaudeAgentOptions.max_turns)
# Type: integer
# Default: 2000
# Environment Variable: AGENTDAG___KERNEL__MAX_TURNS=2000
# .env: KERNEL__MAX_TURNS=2000
# Deliberately very high: the TOKEN budget is the intended bound on a node, and a turn
# ceiling is a second, unrelated limit that bites first and for no stated reason. At 25 it
# was the binding constraint on every real work node measured 2026-09-02 - six of six on
# one run, two of four on the next - each ending its dispatch mid-task. Turns are not a
# cost; tokens are, and `budget` is where a node's cost is declared.
max_turns = 2000

# Purpose: Bash command substrings a node's PreToolUse hook denies outright (design 7)
# Type: array of strings
# Default: the six network-egress / publishing commands below
# Environment Variable: AGENTDAG___KERNEL__DENY_BASH=git push,gh pr,gh release
# .env: KERNEL__DENY_BASH=git push,gh pr,gh release
# Note: matched as a substring after whitespace-collapsing (see
#   agentdag.adapters.kernel.hooks_claude.deny_bash_commands). This is a denylist
#   for exfiltration/publishing actions, not a general filesystem sandbox: a Bash
#   command that merely WRITES outside the run directory (e.g. `printf x > /tmp/y`)
#   is caught by NOTHING - the live write-set hook sees the Write/Edit tools, not
#   Bash, and the post-node isolation scan walks the run directory only, so it
#   reports a stray write INSIDE the run directory and never one elsewhere on the
#   machine (denylist measured live: workflow/design/probes/m2-hooks-dontask.md in
#   RESEARCH; the scan's reach read at source, isolation_scan.py and context.py).
# Note: a BLANK value (an env var set to nothing) is refused by name before any run
#   directory exists - it is not read as "deny nothing". To close nothing on purpose,
#   write an explicit empty list: `deny_bash = []`, or AGENTDAG___KERNEL__DENY_BASH='[]'.
#   A blank ENTRY is refused too: as a substring it would match every command.
deny_bash = ["git push", "gh pr", "gh release", "curl -X POST", "curl --data", "wget --post"]

# Purpose: tool names every node is refused OUTRIGHT by a PreToolUse hook, whatever the
#   arguments - the boundary for the tools that reach the network or spawn a sub-agent
# Type: array of strings, each a bare tool name (WebFetch, Task, mcp__server__tool)
# Default: ["WebFetch", "WebSearch", "Task"]
# Environment Variable: AGENTDAG___KERNEL__DENY_TOOLS=WebFetch,WebSearch,Task
# .env: KERNEL__DENY_TOOLS=WebFetch,WebSearch,Task
# Note: `allowed_tools` on the SDK is an auto-approval list, not a bound - measured, nodes
#   ran tools outside it - so a deny hook is the only thing that closes a tool. Same
#   blank-versus-empty rule as deny_bash: a blank value is refused, `deny_tools = []` is
#   an operator's statement that this run's nodes may reach the network and sub-agents.
#   An entry that is not a tool-name shape is refused, because a matcher on it would fire
#   on nothing and the tool would read as closed while it is open.
deny_tools = ["WebFetch", "WebSearch", "Task"]

# Purpose: the label a run records as its actor - `owner` in state.json, and `by` on every
#   journal line that names who did something (run_started, resume, retry grant, approve
#   decision, cancel)
# Type: string, non-blank
# Default: "operator" - a constant that identifies nobody. The operating account's name is
#   NEVER read: a run directory copied out as evidence publishes whatever sits here, and
#   nothing in agentdag warns when it does. Set a name only if you want names in run
#   directories, knowing they travel with every copy.
# Environment Variable: AGENTDAG___KERNEL__OPERATOR=ops-desk
# .env: KERNEL__OPERATOR=ops-desk
# Note: an explicit blank ("" or whitespace) is refused by name before any run directory
#   is created, rather than falling back to the default - a blank override is a
#   misconfiguration, not a request for the default.
operator = "operator"
