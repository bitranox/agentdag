# tier-policy.example.yaml
#
# Example tier policy as data (design section 2.3): one row per model, plus the
# kind-default roles and the escalation rule that code applies over this table.
#
# `rank` is the operator's own ordering, used only to decide "next higher rank
# listing the role" on escalation (2.3 rule 2). It carries no meaning beyond
# relative order within this file - adding a model is adding a row (with
# whatever rank slots it into the ordering the operator wants); retiring a
# model is flipping its `available` to false, never deleting the row.
#
# allowed_efforts for the two claude-executor rows and fable use the SDK's
# five-value scale (low, medium, high, xhigh, max). The codex row uses only
# three (low, medium, high) because Codex has no first-class effort field:
# the adapter maps whichever of these three is requested onto
# config.model_reasoning_effort in the codex MCP tool call (design section 6).

models:
  - alias: haiku
    executor: claude
    rank: 10
    cost_class: low
    available: true
    roles:
      - mechanical
    allowed_efforts: [low, medium, high, xhigh, max]
    # context ceiling: a node writes a typed handover and ends needs_continuation past this (3.8);
    # default about half the row's window until the calibration probe replaces it
    handover_at_tokens: 100000
    # money is DERIVED from tokens with these list prices (USD per million tokens);
    # billing=subscription prices at zero marginal cost and still counts toward quota
    usd_per_mtoken: {in: 1.0, out: 5.0, cache_read: 0.1}
    billing: subscription   # this deployment: Claude rows on a subscription token; Codex on an API key (RELAYED)

  - alias: sonnet
    executor: claude
    rank: 20
    cost_class: mid
    available: true
    roles:
      - standard
    allowed_efforts: [low, medium, high, xhigh, max]
    # context ceiling: a node writes a typed handover and ends needs_continuation past this (3.8);
    # default about half the row's window until the calibration probe replaces it
    handover_at_tokens: 100000
    # money is DERIVED from tokens with these list prices (USD per million tokens);
    # billing=subscription prices at zero marginal cost and still counts toward quota
    usd_per_mtoken: {in: 3.0, out: 15.0, cache_read: 0.3}
    billing: subscription   # this deployment: Claude rows on a subscription token; Codex on an API key (RELAYED)

  - alias: codex
    executor: "mcp:codex/codex"
    rank: 25
    # cost_class is not pinned by the design for this row; mid is a placeholder
    # matching its rank sitting between sonnet and opus.
    cost_class: mid
    # available: false because NOTHING WIRES "mcp:codex/codex". The Codex executor was the
    # old M4 and it is CUT; this row outlived the arm it belonged to. Left at true it is
    # offered to the planner, resolves for any standard or deep node, and dies at dispatch
    # after the planner has already been paid - measured 2026-09-02, three nodes in one run.
    # Set it back to true in the same change that wires the executor, never before:
    # wire_kernel refuses a table advertising a row it cannot dispatch.
    available: false
    roles:
      - standard
      - deep
    # Only 3 efforts: Codex has no first-class effort field, the adapter maps
    # this onto config.model_reasoning_effort (design section 6).
    allowed_efforts: [low, medium, high]
    # context ceiling: a node writes a typed handover and ends needs_continuation past this (3.8);
    # default about half the row's window until the calibration probe replaces it
    handover_at_tokens: 100000
    # money is DERIVED from tokens with these list prices (USD per million tokens);
    # billing=subscription prices at zero marginal cost and still counts toward quota
    usd_per_mtoken: {in: null, out: null, cache_read: null}   # unknown for this row; fill from the provider's price list
    billing: metered   # this deployment: Claude rows on a subscription token; Codex on an API key (RELAYED)

  - alias: opus
    executor: claude
    rank: 30
    cost_class: high
    available: true
    roles:
      - deep
    allowed_efforts: [low, medium, high, xhigh, max]
    # context ceiling: a node writes a typed handover and ends needs_continuation past this (3.8);
    # default about half the row's window until the calibration probe replaces it
    handover_at_tokens: 100000
    # money is DERIVED from tokens with these list prices (USD per million tokens);
    # billing=subscription prices at zero marginal cost and still counts toward quota
    usd_per_mtoken: {in: 5.0, out: 25.0, cache_read: 0.5}
    billing: subscription   # this deployment: Claude rows on a subscription token; Codex on an API key (RELAYED)

  - alias: fable
    executor: claude
    rank: 40
    cost_class: premium
    # Fable is available per the user, decided 2026-08-17.
    available: true
    roles:
      - top
    allowed_efforts: [low, medium, high, xhigh, max]
    # context ceiling: a node writes a typed handover and ends needs_continuation past this (3.8);
    # default about half the row's window until the calibration probe replaces it
    handover_at_tokens: 100000
    # money is DERIVED from tokens with these list prices (USD per million tokens);
    # billing=subscription prices at zero marginal cost and still counts toward quota
    usd_per_mtoken: {in: 10.0, out: 50.0, cache_read: 1.0}
    billing: subscription   # this deployment: Claude rows on a subscription token; Codex on an API key (RELAYED)

# Kind defaults map to a ROLE, never a model (design 2.3 rule 1). `effort:
# inherit` is the design's own term for "no explicit default here; take the
# value from the calling context" (2.3 rule 6) - it is NOT one of the
# allowed_efforts enum values, only a sentinel used in this table, and never a
# node value (a node that inherits simply omits `effort`).
#
# One row per DISPATCHED kind (design 2.1): the coordinator-code patterns
# (until-pass, until-dry, route, vote) are not kinds and get no record, compact
# is a field on work, and deadline_s is a scheduler field - none of them appear
# here. Kinds whose executor is code get tier_role: null; so do map and batch,
# which resolve no model row at all - the standard default of a map belongs to
# its BODY nodes, which carry their own tier_role.
kind_defaults:
  work:
    # General default for a work node; mechanical-scan/transcription/
    # 1-2-file complete-spec work and adversarial-verification/judge-panel/
    # final-synthesis work are overrides the planner sets per node (rule 1,
    # rule 3), not a different kind.
    tier_role: standard
    effort: inherit
  gate:
    tier_role: null  # code, no model (2.3 rule 1)
    effort: null
  synth:
    tier_role: deep  # root-cause judgment (2.3 rule 1)
    effort: high
  planner:
    tier_role: deep  # 2.3 rule 1
    effort: high
  approve:
    tier_role: null  # code + human, no model (section 4 primitives table)
    effort: null
  map:
    tier_role: null  # fan-out performed by the coordinator; the standard default belongs to the BODY nodes (2.3 rule 1)
    effort: null
  reduce:
    tier_role: null  # code, no model (2.3 rule 1)
    effort: null
  wait:
    tier_role: null  # code, no model (2.3 rule 1)
    effort: null
  batch:
    tier_role: null  # fold performed by the coordinator; the folded BODY carries the standard default
    effort: null
  stage:
    tier_role: null  # code, no model (2.3 rule 1)
    effort: null
  apply:
    tier_role: null  # code, no model (2.3 rule 1)
    effort: null

# Escalation on blocked/needs_context: re-dispatch ONCE one rank up with the
# same brief plus the failure record; a second failure suspends into approve
# rather than climbing further (2.3 rule 5). Note that `mechanical` is carried
# only by haiku here and `top` only by fable, so for those two roles there is NO
# higher available row: the node suspends into approve immediately rather than
# retrying in place (2.3 rule 5, C17). Resolution has its own fallback, one role
# DOWN the order mechanical < standard < deep < top when no available row lists
# the requested role - which is where graph C's "top if available, else deep"
# comes from; no row here lists both, and it is a coordinator rule rather than a
# property of this table (2.3 rule 2, C2).
escalation:
  max_hops: 1
  then: approve
  no_higher_row: approve
  on_auth_failure: fail_run   # an auth failure never escalates a tier (3.4)
  # Quota is not identity: it clears on its own, so the run ends RESUMABLE and keeps every
  # node it finished. Escalating is wrong for the same reason as above - the limit binds the
  # account, not the row - and the retry path has no backoff to wait it out with.
  on_rate_limit: suspend_run

# The three named thresholds of design 3.5, as policy-table DATA (not code constants), so an
# operator changes one without a redeploy. Each starts at the default 3.5 names; 3.5 also defines
# the drift signal every run logs for it and what "off" reads as.
thresholds:
  # break-even node size below which a node's own dispatch overhead dominates its work (3.4, 3.5).
  # Derived as startup / f from two inputs: a per-dispatch startup of ~26,034 first-turn input
  # tokens, MEASURED over six work nodes (probes/m2-kernel.md), and an acceptable overhead
  # fraction f of 0.10, which is the point 3.5 itself calls "no room left to split". Stated in
  # TOKENS, not minutes: a dispatch's token count does not move with cache state, its wall-clock
  # does, and the token form needs no throughput term, which was the noisiest input. Full
  # derivation, with a provenance tier per input and the sensitivities:
  # min-node-minutes-derivation.md.
  # OPEN, and it decides this number: design 3.5's denominator counts cache reads, which are
  # 80-98% of input in every measured row. A cost-weighted or cache-excluded definition moves
  # this floor by up to 30x. The value below uses 3.5's own definition, so that the floor and
  # the drift signal checking it share one scale; settle the definition before a planner is
  # handed this.
  # Startup scales with the brief and the enabled tool set, so a change to either moves this
  # floor in direct proportion and it must be re-derived from one measurement of the new
  # configuration, never by adding probes together.
  min_node_tokens: 260000
  # fan-in ceiling for a reduce/synth tree before a node's citation coverage degrades (3.4, 3.5).
  reduce_tree_fanin: 12
  # journal line count that is a SIGNAL, not a trigger, until real runs exist to measure against
  # (3.4, 3.5); Continue-As-New is not part of this design.
  journal_max_lines: 5000
  # how many handovers a node chain may take before it ends failed/continuation_limit (3.8)
  max_continuations: 3
  # how many times ONE code node may be dispatched before its transient failure stands. 2 means
  # one retry, mirroring design 2.3 rule 5, which re-dispatches ONCE and suspends on the second
  # failure rather than climbing. Only a FAILED record carrying a TRANSIENT error retries: a red
  # gate carries no error at all (it ran and answered), and a KernelError is stamped
  # non-transient because the same inputs reproduce it. 1 disables retrying entirely.
  max_attempts: 2

# Run-level ceilings the coordinator validates and clamps against (design 2.3
# "Run limits", 2.4, 3.4). Per-node budgets live in the node spec; these bound
# the whole run and the whole workflow.
run_limits:
  # the run's token cap per model row: the dispatch that would cross it raises
  # BudgetExceeded (3.4)
  # NOTE the unit changed 2026-09-03: input + cache_creation + output, the figure
  # `charged_tokens` now carries. They used to include cache reads, which are 80-98
  # percent of input on every measured row, so the same numeral was worth roughly a
  # seventeenth of what it appeared to be. Raised here rather than merely re-scaled: the
  # intended bound on a run is the operator's own ceiling, and these exist to stop a runaway,
  # not to size a job.
  tokens_per_row:
    haiku: 20000000
    sonnet: 20000000
    codex: 20000000
    opus: 20000000
    fable: 20000000
  # the largest deadline_s any node may declare
  deadline_ceiling_s: 86400
  # the highest role each kind may resolve to, after any planner override
  per_kind_ceiling:
    work: deep
    synth: top
    planner: deep
  # the kinds a PLANNER-emitted spec may carry (2.4). apply is never planner-emitted:
  # it performs a staged side effect, so a hand-authored node owns every irreversible
  # step. stage and approve ARE planner-emitted (DECISIONS.md item 8, 2026-08-22) - a
  # plan may write an intent and may ask for a human gate, and the workflow still
  # decides what that gate does
  planner_kinds: [work, gate, synth, map, reduce, wait, batch, stage, approve]
  # a `top` request below this fraction of the row's remaining run budget is
  # downgraded and audited (2.3 rule 4 - the design's "5%")
  top_role_budget_floor: 0.05
  # M6 (Task 30): how many times ONE plan may be re-planned before its subtree stops.
  # ENFORCED since Task 35 by execute_plan: a refuted condition stops the subtree, the barrier
  # waits its in-flight nodes out, and the planner is re-dispatched with the cause, until this
  # many re-dispatches have been spent. Per PLAN, not per run - a sub-plan gets its own
  # allowance, and its exhaustion is reported to its parent rather than raised through it.
  # At the ROOT there is no parent to report to, so exhaustion asks a person, and a granted
  # round buys another whole max_replans. This is therefore the size of ONE round rather than
  # the total a root run may spend; only a person can grant more, since the question defaults
  # to abandoning and a default is the only option an unattended deadline applies.
  max_replans: 3
  # M6 (Task 30): how many nodes ONE LAUNCH may dispatch, across every plan it accepts.
  # ENFORCED since Task 33 by execute.NodeBudget, which counts across the whole run - a
  # nested sub-plan spends from this same total, never from a fresh per-plan allowance.
  # Checkpoint A (2026-08-29) raised this from 200 for the same reason as max_nodes_per_plan
  # below: a ceiling calibrated on what planners produce refuses legitimate wide work. So it
  # is a RUNAWAY GUARD, not a spending plan - at this size it fires only on a run that has
  # gone wrong, which is why exhausting it at the root asks a person rather than failing the
  # run (Task 37). A granted round buys another whole allowance and takes effect at the START
  # of the next launch. Note it is charged per LAUNCH and a journal-served replay costs the
  # same as work that ran, so a resumed run spends part of this re-charging its own history.
  max_nodes_per_run: 1000
  # M6 (Task 30): how many entries a single accepted plan may carry, enforced by
  # validate_plan's size rule.
  # Checkpoint A (2026-08-29) raised this from 40 to 1000. The 40 was calibrated on what E1's
  # planners PRODUCED (largest measured distribution, 38 entries), which is the wrong
  # population: it refused graph A at N=20 for being WIDE, and width is a fact about the
  # fleet, not a planner defect. At 1000 the rule fires only on a pathological plan and keeps
  # what an admission-time refusal is good at: refusing whole, with a reason, before any spend.
  max_nodes_per_plan: 1000
  # M6 (Task 33): how deep a plan may nest sub-plans. Its own key rather than a second use of
  # max_replans (Checkpoint B, user 2026-08-29) - re-plan tolerance and nesting depth are two
  # quantities, and one value for both makes tuning either change the other.
  # NOT CALIBRATED, and deliberately said so: no run has nested a plan yet, so there is no
  # distribution to read. It is a runaway stop, chosen on the reasoning that a goal needing
  # more than five levels of sub-planning has a decomposition problem a deeper limit will not
  # fix. Unlike max_nodes_per_plan it is not measuring a fleet, so being wrong by 2x costs a
  # clear error rather than a refused legitimate plan. Revisit against the first real nested
  # run: if it ever refuses a plan a human would have allowed, it was too low.
  max_plan_depth: 5

# Shared resources (design 3.6): write_set is paths only; a node names what it consumes in
# requires: [{resource, amount}]. kind: mutex (capacity 1) | capacity (in unit) | rate (per window).
# capacity is the ceiling this deployment lets the coordinator use; probe (optional) returns what is
# available NOW and admission uses min(capacity, probed); enforce (optional) names a real mechanism.
# Admission counters live in a HOST-LEVEL lease store shared by every coordinator on the box, not in
# one process, so two concurrent runs cannot both admit against the same machine-wide row.
# A `rate` row counts calls COMPLETED inside the window as well as in-flight ones: a finished call
# still occupies its slot until the window moves, and counting in-flight amounts alone rate-limits
# nothing. A probe row states its cadence and a reading TTL; a reading older than the TTL is not
# used and the row falls back to its registry capacity. There is no eviction: a node admitted at
# 8 GiB free is not evicted when free drops to 7 (one threshold, so it is not a hysteresis band).
# probe and enforce are ARGV lists from a fixed allowlist with typed substitution, never shell
# strings, and this file is root-owned and not writable by the coordinator user (design 3.1, O15).
# IN SLICE 1 only the bmk-tool-env row is actually consumed (requires: in graph A); the rest of
# this list, the probes and the discovery pass are later (../../../PLANS/build-plan-high.md).
resources:
  - name: bmk-tool-env            # the machine-wide bmk tool environment `make test` uses
    kind: mutex
    unit: slot
    capacity: 1
    # a mutex SHOULD name the real lock the gate command itself takes: admission binds only what
    # this coordinator dispatches, never a second agent session or the user's own `make test`.
    # No such lock exists today: the coordinator's own host-wide gate FileLock (this path's
    # origin) was retired 2026-08-20 (b9ee2de) once bmk >= 3.17.0 began guarding its shared tool
    # env itself - a lock inside bmk's own uv tool dir, not one this coordinator can safely
    # re-take without serialising the concurrent gates that refactor restored. Admission-only
    # until the host-level lease registry (later work) names a real mechanism.
    enforce: null
  - name: pypi-publish            # one publish at a time per package; the workflow names the package as amount 1
    kind: mutex
    unit: slot
    capacity: 1
    enforce: ["flock", "/run/lock/agentdag/pypi-publish"]
  - name: gpu0-vram
    kind: capacity
    unit: GiB
    capacity: 20                  # ceiling for the coordinator; the card has 24
    probe: ["nvidia-smi", "--query-gpu=memory.free", "--format=csv,noheader,nounits"]   # returns MiB; adapter converts
    probe_cadence_s: 30
    probe_ttl_s: 120
    enforce: ["env", "CUDA_VISIBLE_DEVICES=0"]
  - name: host-ram
    kind: capacity
    unit: GiB
    capacity: 32
    probe: ["agentdag-probe", "mem-available-gib"]   # argv from the allowlist, never a shell pipeline
    probe_cadence_s: 30
    probe_ttl_s: 120
    enforce: ["systemd-run", "--scope", "-p", "MemoryMax={amount}G"]   # typed substitution, not string interpolation
  - name: pypi-api-calls
    kind: rate
    unit: calls
    capacity: 60
    window: 60s          # counts calls COMPLETED within the window, not just in-flight ones
  - name: run-store-disk
    kind: capacity
    unit: GiB
    capacity: 50         # per-run ceiling on /var/lib/agentdag; run.start refuses below it (design 3.1)
    probe: ["agentdag-probe", "disk-free-gib", "/var/lib/agentdag"]
    probe_cadence_s: 300
    probe_ttl_s: 900
  - name: claude-credential-refresh   # refreshing one auth token is a mutex, so parallel nodes do not race it (3.4)
    kind: mutex
    unit: slot
    capacity: 1

